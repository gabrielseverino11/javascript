<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Usando novas Strings</title>
    <style>
        body{
            font: normal 22pt Arial;
        }
    </style>
</head>
<body>
    <script>
        var nome = window.prompt("Qual e o seu nome ")
        document.write(` Olá, <strong>${nome}</strong> Seu nome tem: ${nome.length} letras.</br> `)
        document.write(`Seu nome em maiusculas é ${nome.toUpperCase()} `) 
        document.write(`Seu nome em minusculas e ${nome.toLowerCase()}`)
    </script>
    
</body>
</html>
