    <div id="res">

    </div>

    <script>
        function verificar () {
            var txtp = window.document.querySelector('input#txtpais');
            var res = document.querySelector('div#res');
            var pais = txtp.value;

            res.innerHTML = `<P>Vivendo em ${pais}</>`;

            if (pais == 'Brasil') {
                re.innerHTML += '<P> Voce é Brasileiro!';
            } else {
                res.innerHTML += '<P> Voce é Estrangeiro';
            }
        }
    </script>
        
</body>
